name: Safely
description: >-
  Safely (SafelyStay, Inc.) is an InsurTech company providing short-term rental
  insurance, guest screening, and travel insurance for vacation rental property
  managers and their guests. The Safely Protection Policy offers up to $1,000,000
  in short-term rental insurance covering guest-caused accidental and intentional
  damage, theft, pet damage, and bodily injury liability, while its guest
  screening verifies guests before check-in. Safely connects to property
  management systems through turnkey partner integrations (Guesty, Hostaway,
  Hostfully, OwnerRez, Track, Streamline, Escapia, Lodgify, and more) rather than
  a public developer API. A Techstars-backed company added to the API Evangelist
  network; this profile was enriched by the pipeline, which found no public API
  surface.
